name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    name: Unit & Mockito tests (threads, jUnitAndCode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: >
          mvn -B test
          -Dtest=CombinedRestrictionsTests,ExtensionValidationTests,FileSizeValidationTests,UniqueNameRestrictionTests,PackageTransferServiceTests,PackageTransferServiceMockitoExampleTest,TransferRestrictionsMockitoExampleTest,FooBarTests

      - name: Upload unit test Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit
          path: target/allure-results
          retention-days: 5

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-unit
          path: target/surefire-reports
          retention-days: 5

  selenium-tests:
    name: Selenium E2E tests (live site - allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Selenium tests (headless)
        run: mvn -B test -Dtest=AmazonBookBuyTests -Dheadless=true

      - name: Upload Selenium Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-selenium
          path: target/allure-results
          retention-days: 5

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-screenshots
          path: target/screenshots
          retention-days: 5
          if-no-files-found: ignore

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: [ unit-tests, selenium-tests ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download unit test results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-unit
          path: allure-results

      - name: Download Selenium results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: allure-results-selenium
          path: allure-results

      - name: Load previous report history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
