name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    name: Unit & Mockito tests (threads, jUnitAndCode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Homework
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Homework/pom.xml

      - name: Run unit tests
        run: >
          mvn -B test
          -Dtest=CombinedRestrictionsTests,ExtensionValidationTests,FileSizeValidationTests,UniqueNameRestrictionTests,PackageTransferServiceTests,PackageTransferServiceMockitoExampleTest,TransferRestrictionsMockitoExampleTest,FooBarTests

      - name: Upload unit test Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit
          path: Homework/target/allure-results
          retention-days: 5

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-unit
          path: Homework/target/surefire-reports
          retention-days: 5

  selenium-tests:
    name: Selenium E2E tests (live site - allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Homework
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Homework/pom.xml

      - name: Run Selenium tests (headless)
        run: mvn -B test -Dtest=AmazonBookBuyTests -Dheadless=true

      - name: Upload Selenium Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-selenium
          path: Homework/target/allure-results
          retention-days: 5

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-screenshots
          path: Homework/target/screenshots
          retention-days: 5
          if-no-files-found: ignore

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: [ unit-tests, selenium-tests ]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Homework
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Homework/pom.xml

      - name: Download unit test results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-unit
          path: Homework/target/allure-results

      - name: Download Selenium results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: allure-results-selenium
          path: Homework/target/allure-results

      - name: Build Allure report
        run: mvn -B io.qameta.allure:allure-maven:3.1.0:report

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Homework/target/site/allure-maven-plugin
